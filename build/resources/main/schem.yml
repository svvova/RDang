ignore-air-blocks: true # Игнорировать блоки воздуха при вставке схемы
clear-vegetation: true # Удалять деревья и растительность вокруг региона ПЕРЕД вставкой схемы
clear-area-before-paste: true # Очищать объём данжа в воздух перед вставкой, чтобы блоки земли не замуровывали сундуки

schem-offset: # Смещение схемы относительно точки вставки
  x: 0
  y: 1
  z: 0

world-heights: # Настройки высот для разных миров можно кастом миры добавлять
  normal:
    type: normal
    min: 60
    max: 256
    use-default-algorithm: true

  nether:
    type: nether
    min: 32
    max: 100
    use-default-algorithm: true

  end:
    type: the_end
    min: 40
    max: 80
    use-default-algorithm: true
custom-worlds:
  world1: #Это worldName (название папки мира)
    type: normal #Это type (просто категория для дефолтов)
    min: 70
    max: 256
    use-default-algorithm: true

# Настройки для конкретных схем (перекрывают глобальные значения выше)
# Ключ — имя файла схемы с расширением (например dungeon1.schem)
schematics:
  # Пример схемы без явных стен (стены = рельеф вокруг):
  # dungeon_cave.schem:

auto:
  enabled: true  # Если поставить false, автоматическое удаление работать не будет
  time: "10s" # Можно "1m 30s", "1h", "1d" и т.д.

  spawn:
    enabled: false  # Автоматический спавн данжей по таймеру
    interval: "1h"  # Интервал спавна. Примеры: "30m", "2h", "1d"
    worlds: []      # Список миров для спавна. Если пусто — все миры с зарегистрированными данжами
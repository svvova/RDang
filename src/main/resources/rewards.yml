    min: 0
    max: 500
  item-picks: 4
  # Яйца питомцев за победу в PvE (выдаются командой /petadmin giveegg <ник> <epic/legendary/rare>)
  # Каскадный шанс: сначала проверяется Legendary (10%), затем Epic (25%), затем Rare (75%)

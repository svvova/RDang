name: JamDungeons
version: 1.1.9
main: org.jamhardcore.dungeons.JamDungeons
api-version: '26.3'
authors: [JamHardcore]
description: Six PvE dungeon themes, shared PvP events and in-game administration
softdepend: [Vault, PlaceholderAPI, PhoenixCrates, JamCore, WorldGuard, WorldEdit, FastAsyncWorldEdit]
commands:
  jamdungeons:
    aliases: [jd, dungeons]
    description: Данжи и панель администратора Jam Hardcore
    usage: /jd help
permissions:
  jamdungeons.play:
    default: true
  jamdungeons.claim:
    default: true
  jamdungeons.admin:
    default: op
  jamdungeons.bypass:
    description: Обход PvE-региона только в creative и spectator
    default: op
